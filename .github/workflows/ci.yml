# CI/CD: on every push and pull request, run the tests on a fresh Linux machine (CI);
# if they pass on main, build the API's Docker image and publish it to GitHub Container Registry (CD).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PyTorch (CPU) and the API's libraries
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-api.txt pytest httpx
      - name: Run the tests (fake models, no weights or GPU needed)
        run: pytest

  docker:
    needs: test                  # only if the tests pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # to publish the image to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and on main, publish) the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max